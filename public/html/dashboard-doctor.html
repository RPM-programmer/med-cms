<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель Врача | MED-CMS</title>
    <link rel="stylesheet" href="/med/css/doctor.css">
</head>
<body>
    <div class="dashboard">
        <header>
    <div>
        <h1 id="doctorTitle">АРМ Медицинского Сотрудника</h1>
        <p style="margin: 5px 0 0 0; font-size: 14px; opacity: 0.9;">
            Вы вошли как: <span id="doctorPosition" style="font-weight: bold; text-decoration: underline;">Загрузка должности...</span> 
            (<span id="doctorName">ФИО</span>)
        </p>
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
        <!-- Кнопка вызова модального окна смены пароля -->
        <button onclick="togglePasswordModal()" class="btn-logout" style="background: #2563eb; border-color: #2563eb;">Сменить пароль</button>
        <button onclick="logout()" class="btn-logout">Выйти</button>
    </div>
</header>

<!-- Модальное окно для смены пароля (вставьте перед закрывающим тегом </body>) -->
<div id="passwordModal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 9999;">
    <div style="background: white; padding: 25px; border-radius: 8px; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
        <h3 style="margin-top:0; color:#1e3a8a;">Смена пароля</h3>
        <form id="changePasswordForm">
            <div class="form-group">
                <label>Текущий пароль</label>
                <input type="password" id="oldPassword" required style="width:100%; padding:8px; box-sizing:border-box; border:1px solid #cbd5e1; border-radius:4px;">
            </div>
            <div class="form-group">
                <label>Новый пароль</label>
                <input type="password" id="newPassword" required style="width:100%; padding:8px; box-sizing:border-box; border:1px solid #cbd5e1; border-radius:4px;">
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button type="submit" class="btn-save" style="padding:10px; font-size:14px;">Сохранить</button>
                <button type="button" onclick="togglePasswordModal()" class="btn-logout" style="color:#0f172a; background:#e2e8f0; border-color:#cbd5e1; width:100%;">Отмена</button>
            </div>
        </form>
    </div>
</div>


        <div class="main-content">
            <!-- Список приемов -->
            <section class="schedule-section">
                <h3>Записи на сегодня</h3>
                <ul id="scheduleList" class="patient-list">
                    <li>Загрузка расписания...</li>
                </ul>
            </section>

            <!-- Окно текущего осмотра -->
            <section class="exam-section hidden" id="examBlock">
                <h3>Проведение осмотра: <span id="currentPatientName"></span></h3>
                <form id="examForm">
                    <input type="hidden" id="activeAppointmentId">
                    
                    <div class="form-group">
                        <label>Жалобы пациента</label>
                        <textarea id="examComplaints" required placeholder="Кашель, температура 38.2..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Объективные данные осмотра</label>
                        <textarea id="examObjective" required placeholder="Зев гиперемирован, хрипы в легких..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Личные заметки врача / Лечение</label>
                        <textarea id="examNotes" placeholder="Рекомендован постельный режим..."></textarea>
                    </div>

                    <!-- Выпадающий список болезней, подтягиваемый из нашей SQLite БД -->
                    <div class="form-group">
                        <label>Установить диагноз (Болезнь)</label>
                        <select id="examDisease" required>
                            <option value="">-- Выберите диагноз из справочника МКБ --</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-save">Завершить осмотр и внести в статистику</button>
                </form>
            </section>
        </div>
    </div>
    <script src="/med/js/doctor.js"></script>
</body>
</html>
