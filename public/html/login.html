<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Медицинская Платформа | Вход</title>
    <link rel="stylesheet" href="/med/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box" id="loginBox">
            <h2>Вход в систему</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required placeholder="doctor@clinic.com">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Войти</button>
            </form>
            <p class="toggle-text">Впервые у нас? <span onclick="toggleAuth()">Зарегистрироваться как пациент</span></p>
        </div>
        <div class="auth-box hidden" id="registerBox">
            <h2>Регистрация пациента</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>ФИО полностью</label>
                    <input type="text" id="regName" required placeholder="Иванов Иван Иванович">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required placeholder="patient@mail.ru">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="regPassword" required placeholder="Минимум 6 символов">
                </div>
                <button type="submit" class="btn">Создать аккаунт</button>
            </form>
            <p class="toggle-text">Уже есть аккаунт? <span onclick="toggleAuth()">Войти</span></p>
        </div>
    </div>
    <script src="/med/js/auth.js"></script>
</body>
</html>
